<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>{% block title %}防災アプリ{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: #344054;
      background: #f7f8fa;
      font-family: "Noto Sans JP", "Yu Gothic UI", Meiryo, sans-serif;
    }
    .site-header {
      height: 72px;
      color: #fff;
      background: #285bab;
      box-shadow: 0 2px 8px rgb(20 47 91 / 14%);
    }
    .header-inner {
      width: min(1380px, calc(100% - 48px));
      height: 100%;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
    }
    .brand {
      margin: 0;
      color: #fff;
      font-size: 24px;
      font-weight: 700;
      line-height: 1;
    }
    .menu-toggle {
      width: 40px;
      height: 40px;
      display: grid;
      place-content: center;
      gap: 4px;
      padding: 0;
      border: 0;
      color: #fff;
      background: transparent;
      cursor: pointer;
    }
    .menu-toggle span {
      width: 23px;
      height: 3px;
      display: block;
      border-radius: 1px;
      background: currentColor;
    }
    .site-navigation {
      display: none;
      position: absolute;
      z-index: 1000;
      top: 100%;
      right: 0;
      min-width: 210px;
      padding: 8px;
      border-radius: 0 0 8px 8px;
      background: #285bab;
      box-shadow: 0 8px 18px rgb(20 47 91 / 18%);
    }
    .site-navigation.is-open { display: grid; }
    .site-navigation a {
      padding: 11px 12px;
      border-radius: 4px;
      color: #fff;
      text-decoration: none;
    }
    .site-navigation a:hover,
    .site-navigation a:focus-visible { background: rgb(255 255 255 / 14%); }
    .navigation-status {
      padding: 10px 12px;
      color: #dce8fb;
      font-size: 14px;
    }
    @media (max-width: 600px) {
      .header-inner { width: calc(100% - 32px); }
      .brand { font-size: 22px; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <h1 class="brand">防災アプリ</h1>
      <button class="menu-toggle" type="button" aria-label="メニューを開く" aria-expanded="false" aria-controls="siteNavigation">
        <span></span><span></span><span></span>
      </button>
      <nav class="site-navigation" id="siteNavigation">
        <a href="/">ホーム</a>
        <a href="/shelter_search">避難所検索</a>
        <a href="/shelter_register">避難所登録</a>
        <a href="/board">指示・発信ボード</a>
        {% if session.logged_in %}
          <span class="navigation-status">ログイン中{% if session.username %}（{{ session.username }}）{% endif %}</span>
          <a href="/logout">ログアウト</a>
        {% else %}
          <span class="navigation-status">未ログイン</span>
          <a href="/login">ログイン</a>
        {% endif %}
      </nav>
    </div>
  </header>

  <main>
    <!-- ここに子テンプレートの content が入る -->
    {% block content %}{% endblock %}
  </main>
  <script>
    const menuToggle = document.querySelector('.menu-toggle');
    const siteNavigation = document.querySelector('#siteNavigation');
    menuToggle.addEventListener('click', function() {
      const isOpen = siteNavigation.classList.toggle('is-open');
      menuToggle.setAttribute('aria-expanded', String(isOpen));
      menuToggle.setAttribute('aria-label', isOpen ? 'メニューを閉じる' : 'メニューを開く');
    });
  </script>
</body>
</html>
